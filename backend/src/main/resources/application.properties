spring.application.name=backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET}


# =========================================================
# RAZORPAY TEST CONFIGURATION
# =========================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


# =========================================================
# FILE UPLOAD
# =========================================================

app.upload.dir=uploads/products

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.cors.allowed-origin=http://localhost:5173

# =====================================================
# AI - Google Gemini
# =====================================================

# Gemini Chat
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

    # Gemini Embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
# =====================================================
# AI - Qdrant Vector Database
# =====================================================

spring.ai.vectorstore.qdrant.host=93d897b8-0495-4641-9f61-df9cc44a6105.us-east-2-0.aws.cloud.qdrant.io
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.collection-name=shopsphere-products
spring.ai.vectorstore.qdrant.use-tls=true
spring.ai.vectorstore.qdrant.initialize-schema=true

logging.level.org.springframework.security=DEBUG